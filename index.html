<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d0b">
  <meta name="description" content="Uma contagem regressiva para um momento especial.">
  <title>Até o nosso momento</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap');
    :root { color-scheme: dark; --cream: #f3e7d0; --muted: rgba(243,231,208,.72); --gold: #d8ad74; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100svh; overflow: hidden; background: #100d0b; color: var(--cream); font-family: 'DM Sans', sans-serif; }
    .scene { position: relative; display: grid; min-height: 100svh; place-items: center; isolation: isolate; overflow: hidden; padding: max(28px, env(safe-area-inset-top)) 24px max(36px, env(safe-area-inset-bottom)); }
    .backdrop, .shade, .grain { position: absolute; inset: 0; }
    .backdrop { z-index: -3; background: #100d0b; }
    .backdrop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; opacity: 0; transform: scale(1.04); transition: opacity 1.5s ease, transform 8s ease; }
    .backdrop img.active { opacity: .72; transform: scale(1.12); }
    .shade { z-index: -2; background: radial-gradient(ellipse at 50% 42%, rgba(17,12,9,.15) 0%, rgba(12,9,8,.42) 44%, rgba(8,7,6,.78) 100%), linear-gradient(180deg, rgba(10,8,7,.35), transparent 30%, rgba(9,8,7,.46)); }
    .grain { z-index: -1; opacity: .13; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E"); }
    .content { width: min(100%, 850px); text-align: center; animation: arrive 1.2s both; }
    .ornament { color: var(--gold); font-size: 19px; letter-spacing: .45em; margin-bottom: clamp(22px, 5vh, 44px); opacity: .9; }
    h1 { margin: 0 auto clamp(30px, 6vh, 52px); color: #f5ead9; font: 500 clamp(30px, 5.2vw, 64px)/1.28 'Cormorant Garamond', Georgia, serif; text-wrap: balance; text-shadow: 0 2px 30px rgba(0,0,0,.35); }
    .timer { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); width: min(100%, 700px); margin: 0 auto; }
    .unit { position: relative; padding: 5px clamp(7px, 2.4vw, 26px) 8px; }
    .unit + .unit::before { content: ''; position: absolute; left: 0; top: 22%; height: 56%; width: 1px; background: linear-gradient(transparent, rgba(226,194,152,.55), transparent); }
    .number { display: block; font: 400 clamp(46px, 9vw, 94px)/1 'Cormorant Garamond', Georgia, serif; font-variant-numeric: tabular-nums; letter-spacing: .025em; text-shadow: 0 2px 24px rgba(0,0,0,.38); }
    .label { display: block; margin-top: 12px; color: var(--muted); font-size: clamp(9px, 1.8vw, 11px); letter-spacing: .22em; text-transform: uppercase; }
    .when { margin: 37px 0 0; color: rgba(243,231,208,.78); font: 400 15px 'Cormorant Garamond', Georgia, serif; letter-spacing: .16em; }
    .when::before { content: ''; display: block; width: 36px; height: 1px; margin: 0 auto 18px; background: var(--gold); opacity: .72; }
    .carousel { position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; display: flex; align-items: center; gap: 10px; transform: translateX(-50%); }
    .dot { width: 6px; height: 6px; padding: 0; border: 1px solid rgba(243,231,208,.72); border-radius: 50%; background: transparent; cursor: pointer; transition: all .3s; }
    .dot[aria-current="true"] { width: 19px; border-color: var(--gold); border-radius: 5px; background: var(--gold); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 520px) {
      .scene { padding-inline: 18px; }
      .backdrop img { object-position: center; }
      .backdrop img.active { opacity: .64; }
      .ornament { margin-bottom: 30px; font-size: 16px; }
      h1 { font-size: clamp(28px, 8vw, 40px); margin-bottom: 44px; }
      .unit { padding-inline: 3px; }
      .number { font-size: clamp(43px, 13vw, 66px); }
      .label { letter-spacing: .12em; font-size: 9px; margin-top: 10px; }
      .when { margin-top: 34px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="scene">
    <div class="backdrop" aria-hidden="true">
      <img src="images/01-figuras.jpeg" alt="" class="active">
      <img src="images/02-relogio.jpeg" alt="">
      <img src="images/03-luz.jpeg" alt="">
      <img src="images/04-espiral.jpeg" alt="">
      <img src="images/05-espiral-dourada.jpeg" alt="">
    </div>
    <div class="shade" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
    <section class="content" aria-label="Contagem regressiva">
      <div class="ornament" aria-hidden="true">✳　✧　✳</div>
      <h1>˚ׅ꯱ҽ ׅ꯱αlѵαɾ ᘎυ ׅ꯱ׅᥱr ꯱ᥲᥣ᥎ᘎ?༅˚</h1>
      <div class="timer" role="timer" aria-live="off" aria-label="Tempo restante">
        <div class="unit"><span class="number" id="days">00</span><span class="label">dias</span></div>
        <div class="unit"><span class="number" id="hours">00</span><span class="label">horas</span></div>
        <div class="unit"><span class="number" id="minutes">00</span><span class="label">minutos</span></div>
        <div class="unit"><span class="number" id="seconds">00</span><span class="label">segundos</span></div>
      </div>
      <p class="when" id="caption">21 de novembro · 13:00</p>
    </section>
    <nav class="carousel" aria-label="Escolher imagem de fundo"></nav>
  </main>
  <script>
    // Horário local do dispositivo: 21 de novembro de 2026, às 13:00.
    const target = new Date(2026, 10, 21, 13, 0, 0, 0);
    const fields = { days: document.querySelector('#days'), hours: document.querySelector('#hours'), minutes: document.querySelector('#minutes'), seconds: document.querySelector('#seconds') };
    const pad = value => String(value).padStart(2, '0');
    function updateCountdown() {
      const remaining = Math.max(0, target.getTime() - Date.now());
      const seconds = Math.floor(remaining / 1000);
      fields.days.textContent = pad(Math.floor(seconds / 86400));
      fields.hours.textContent = pad(Math.floor(seconds % 86400 / 3600));
      fields.minutes.textContent = pad(Math.floor(seconds % 3600 / 60));
      fields.seconds.textContent = pad(seconds % 60);
      if (remaining === 0) document.querySelector('#caption').textContent = 'o momento chegou';
    }
    updateCountdown(); setInterval(updateCountdown, 1000);

    const slides = [...document.querySelectorAll('.backdrop img')];
    const nav = document.querySelector('.carousel');
    let current = 0;
    slides.forEach((_, index) => {
      const button = document.createElement('button');
      button.className = 'dot'; button.type = 'button';
      button.setAttribute('aria-label', `Mostrar imagem ${index + 1} de ${slides.length}`);
      button.setAttribute('aria-current', String(index === 0));
      button.addEventListener('click', () => showSlide(index)); nav.append(button);
    });
    function showSlide(index) {
      current = index;
      slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
      [...nav.children].forEach((dot, i) => dot.setAttribute('aria-current', String(i === index)));
    }
    setInterval(() => showSlide((current + 1) % slides.length), 6000);
  </script>
</body>
</html>
